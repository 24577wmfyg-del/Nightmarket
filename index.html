<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣夜市文化冒險</title>
<style>
body{
font-family:Arial,sans-serif;
background:#fff8e8;
padding:20px;
text-align:center;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

h1{
color:#ff6600;
}

button{
padding:12px 20px;
margin:10px;
border:none;
border-radius:10px;
background:#ff8800;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#ff6600;
}

img{
width:100%;
max-width:500px;
border-radius:10px;
margin:15px 0;
}
</style>
</head>
<div class="container">
<h1>台灣夜市文化冒險</h1>
<script>

let score=0;

function startGame(){

document.getElementById("game").innerHTML=`

<h2>第一關：晚餐吃什麼？</h2>

<p>來到夜市後，你最想嘗試什麼？</p>

<button onclick="food1()">臭豆腐</button>

<button onclick="food2()">大腸包小腸</button>

<button onclick="food3()">珍珠奶茶</button>

`;
}

function food1(){
score+=2;
stage2();
}

function food2(){
score+=3;
stage2();
}

function food3(){
score+=1;
stage2();
}

function stage2(){

document.getElementById("game").innerHTML=`

<h2>第二關：和老闆互動</h2>

<p>老闆問你：「好吃嗎？」</p>

<button onclick="talk1()">用中文回答</button>

<button onclick="talk2()">用英文回答</button>

`;

}

function talk1(){
score+=3;
quiz();
}

function talk2(){
score+=1;
quiz();
}

function quiz(){

document.getElementById("game").innerHTML=`

<h2>第三關：文化挑戰</h2>

<p>珍珠奶茶最早起源於哪裡？</p>

<button onclick="correct()">台灣</button>

<button onclick="wrong()">日本</button>

<button onclick="wrong()">韓國</button>

`;

}

function correct(){
score+=3;
ending();
}

function wrong(){
ending();
}

function ending(){

let result="";

if(score>=8){

result=`
<h2>🏆 夜市文化大師</h2>
<p>你非常了解台灣夜市文化！</p>
`;

}

else if(score>=6){

result=`
<h2>🍢 美食達人</h2>
<p>你發現了許多夜市美食。</p>
`;

}

else if(score>=4){

result=`
<h2>🎒 文化探索者</h2>
<p>你對台灣文化產生濃厚興趣。</p>
`;

}

else{

result=`
<h2>😆 普通觀光客</h2>
<p>雖然有點迷路，但玩得很開心。</p>
`;

}

document.getElementById("game").innerHTML=
result+
`<br><button onclick="location.reload()">重新開始</button>`;

}

</script>

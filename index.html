<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>海盜港口市場</title>
<style>
body { font-family: Arial; background:#0b1d2a; color:white; text-align:center; }
button { margin:5px; padding:10px; cursor:pointer; }
.box { margin-top:20px; }
</style>
</head>

<body>

<h1>🏴‍☠️ 海盜港口市場</h1>
<div id="game"></div>

<script>
const items = [
  {name:"海盜麵包", price:10},
  {name:"火藥桶", price:35},
  {name:"醫療草藥", price:20},
  {name:"船帆修補布", price:15},
  {name:"鯊魚肉乾", price:25}
];

let round = 1;
let maxRound = 5;
let score = 0;
let chosen = [];
let total = 0;

function randomEvent(){
  const events = [
    "🌊 海浪太大！時間緊迫",
    "🏴‍☠️ 海盜打折日！",
    "💰 黑市抬價！",
    "🦜 鸚鵡搗亂！"
  ];
  return events[Math.floor(Math.random()*events.length)];
}

function render(){
  if(round > maxRound){
    document.getElementById("game").innerHTML =
    `<h2>🏁 遊戲結束</h2>
     <p>你的分數：${score}</p>
     <p>${score>=80?"☠️ 傳奇海盜":score>=50?"👍 合格船員":"💀 新手海盜"}</p>
     <button onclick="location.reload()">再玩一次</button>`;
    return;
  }

  chosen = [];
  total = 0;

  let html = `
  <h2>第 ${round} 回合</h2>
  <p>${randomEvent()}</p>
  <p>請選 4 個商品：</p>
  `;

  items.forEach((it, i)=>{
    html += `<button onclick="selectItem(${i})">${it.name} (${it.price})</button>`;
  });

  html += `
  <div class="box">
  <p>已選：${chosen.map(c=>c.name).join(", ")}</p>
  <button onclick="check()">結算</button>
  </div>
  `;

  document.getElementById("game").innerHTML = html;
}

function selectItem(i){
  if(chosen.length < 4){
    chosen.push(items[i]);
    render();
  }
}

function check(){
  if(chosen.length < 4){
    alert("要選滿4個！");
    return;
  }

  total = chosen.reduce((a,b)=>a+b.price,0);
  let ans = prompt("輸入你的總金額：");

  ans = Number(ans);

  if(ans === total) score += 20;
  else if(Math.abs(ans-total)<=5) score += 15;

  alert("正確答案：" + total);

  round++;
  render();
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣夜市文化冒險</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#fff8e8;
    text-align:center;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{
    background:#ff8800;
    color:white;
    border:none;
    padding:12px 20px;
    margin:10px;
    border-radius:10px;
    font-size:18px;
}

button:hover{
    background:#ff6600;
}

h1{
    color:#cc5500;
}
</style>

</head>
<body>

<div class="container">
    <h1>台灣夜市文化冒險</h1>

    <div id="game">
        <p>
        歡迎來到台灣！你是一位來台交換學生，
        想透過夜市了解台灣文化。
        </p>

        <button onclick="startGame()">開始冒險</button>
    </div>
</div>

<script>

let score = 0;

function startGame(){
document.getElementById("game").innerHTML=`
<h2>第一站：選擇夜市</h2>
<button onclick="night1()">士林夜市</button>
<button onclick="night2()">逢甲夜市</button>
<button onclick="night3()">六合夜市</button>
`;
}

function night1(){
score += 10;
document.getElementById("game").innerHTML=`
<h2>士林夜市</h2>
<p>你看到臭豆腐和大腸包小腸。</p>
<button onclick="food()">了解美食文化</button>
`;
}

function night2(){
score += 10;
document.getElementById("game").innerHTML=`
<h2>逢甲夜市</h2>
<p>你看到創意小吃與特色飲料。</p>
<button onclick="food()">了解美食文化</button>
`;
}

function night3(){
score += 10;
document.getElementById("game").innerHTML=`
<h2>六合夜市</h2>
<p>你看到海鮮與高雄特色料理。</p>
<button onclick="food()">了解美食文化</button>
`;
}

function food(){
document.getElementById("game").innerHTML=`
<h2>文化學習</h2>

<p>
臭豆腐是台灣知名街頭小吃，
經過發酵製作而成。
</p>

<p>
蚵仔煎則展現台灣沿海飲食文化，
是許多觀光客必吃的夜市料理。
</p>

<button onclick="quiz()">進行小測驗</button>
`;
}

function quiz(){
document.getElementById("game").innerHTML=`
<h2>小測驗</h2>

<p>臭豆腐最大的特色是什麼？</p>

<button onclick="correct()">發酵製作</button>
<button onclick="wrong()">冷凍製作</button>
`;
}

function correct(){
score += 20;
ending();
}

function wrong(){
ending();
}

function ending(){

let result="";

if(score>=30){
result="夜市文化達人";
}
else{
result="夜市文化新手";
}

document.getElementById("game").innerHTML=`
<h2>遊戲結束</h2>

<p>你的分數：${score}</p>

<h3>${result}</h3>

<p>
恭喜完成台灣夜市文化冒險！
透過夜市美食與文化學習，
更了解台灣的在地特色。
</p>

<button onclick="location.reload()">重新開始</button>
`;
}

</script>

</body>
</html>
